name: BVC Daily Alerts

on:
  schedule:
    - cron: "30 16 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - "bvc_bot.py"
      - ".github/workflows/bvc.yml"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install casased

      - name: Run BVC scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bvc_bot.py

      - name: Save state
        run: |
          if [ -f state_bvc.json ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add state_bvc.json
            git diff --cached --quiet || (git commit -m "update bvc state" && git push)
          fi